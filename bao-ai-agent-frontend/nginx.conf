# This file is intended to be rendered with environment variables before nginx starts.
# Required variables:
# - NGINX_SERVER_NAME
# - NGINX_API_PROXY_TARGET  Example: https://example.com/api/

server {
    listen       80;
    server_name  localhost;

    # 前端静态文件根目录
    root   /usr/share/nginx/html;

    # 所有 HTML 请求都返回 index.html（解决 Vue 路由的 404 问题）
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 请求反向代理到环境变量指定的后端
    location ^~ /api/ {
        proxy_pass https://bao-ai-agent-backend-248399-6-1383336133.sh.run.tcloudbase.com/api/;

        # 设置请求头
        proxy_set_header Host bao-ai-agent-backend-248399-6-1383336133.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 配置
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;

        # 关闭代理错误拦截，保留后端原始响应
        proxy_intercept_errors off;
    }

    # 处理静态资源请求
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # 处理错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
